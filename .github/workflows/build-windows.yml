name: Build Windows Portable

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows
        run: npm run build:win:portable

      - name: Prepare portable package
        shell: pwsh
        run: |
          $portable = "portable\magendamd-setup-windows"

          # Create directories
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$portable\resources\windows"

          # Copy application
          Copy-Item `
            "src-tauri\target\release\magendamd-setup.exe" `
            "$portable\magendamd-setup.exe" `
            -Force

          # Copy Windows resources
          Copy-Item `
            "src-tauri\resources\windows\*" `
            "$portable\resources\windows\" `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "=== Portable package ==="
          Write-Host ""

          Get-ChildItem `
            "$portable" `
            -Recurse |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "=== Total size ==="

          $size = (
            Get-ChildItem "$portable" -Recurse -File |
            Measure-Object -Property Length -Sum
          ).Sum

          Write-Host "Total: $([math]::Round($size / 1MB, 2)) MB"

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: magendamd-setup-windows
          path: portable/magendamd-setup-windows
